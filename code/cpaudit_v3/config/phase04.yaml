# cpaudit_v3 - Phase 4: detecting failure before it matters.
# Edit BEFORE running `setup` (which writes the Phase 4 pre-registration). After that the
# runner refuses a changed config unless you pass --allow-deviation, and it logs the change.
# No model is refitted: Phase 4 reads the Phase 2 LOSO and leave-two-out units and the SOAP
# features, and computes failure-detection scores for every held-out structure.

version: phase04_v1

paths:
  drive_root: /content/drive/MyDrive/NOMAD_Uncer_Quan     # existing folder (read-only use)
  soap_npz: soap_features_corrected_v2.npz
  train_csv_url: https://raw.githubusercontent.com/csutton7/nomad_2018_kaggle_dataset/master/train.csv
  geometry_url: https://raw.githubusercontent.com/csutton7/nomad_2018_kaggle_dataset/master/train/{id}/geometry.xyz
  phase2_dir: phase02_v1                                   # Phase 2 results (read only)
  out_dir: phase04_v1                                      # NEW subfolder; nothing existing is overwritten
  phase1_dir: phase01_v1                                   # Phase 1 results (read only; figures)
  figures_dir: paper_figures_v1                            # NEW subfolder for the paper figures
  local_cache: /content/cpaudit_cache

data:                              # identical to Phase 2 (same de-duplicated dataset, n = 2,343)
  expected_rows: 2400
  expected_features: 23976
  train_csv_sha256: 2be6168b578c4be91b7380e7404a2b58912790d8e03c51b28f4f279f2d8bb872
  composition_decimals: 1
  fd3m_gamma_split_deg: 60.0
  dedup:
    rule: identical_input_and_targets
    matcher: {ltol: 1.0e-3, stol: 1.0e-3, angle_tol: 0.05}
    target_tol: 0.002
    check_tol_ang: 1.0e-3

seed_base: 20261118
alpha_primary: 0.10
reference_interval: cvplus_lattice        # the submitted manuscript's design; defines miscoverage

detect:
  knn: {k: 25, pca_components: 50}        # same distance as the Phase 1-2 normalized score
  kde:                                    # Schultz et al., npj Comput. Mater. (2025)
    kernel: epanechnikov
    bandwidth_quantile: 0.3               # sklearn estimate_bandwidth default
    space: standardized_full              # all 23,976 standardized SOAP features
  classifier: {pca_components: 50, logistic_C: 1.0, cv_folds: 5}
  large_error_quantile: 0.90              # in-distribution 90th percentile of |error|
  min_class: 10                           # within-lattice AUROC needs >= 10 of each class
  bootstrap: 2000                         # cluster bootstrap over composition groups
  abstention_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
                    0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]
  flag: {score: knn, alpha: 0.05, split_folds: 5}   # Bates et al., Ann. Stat. 51, 149 (2023)
  lattice_permutations: 100000

decisions:
  h4_min_auroc: 0.60
  h4_min_diff: 0.05
  g4_auroc: 0.70

compute:
  workers: 1
