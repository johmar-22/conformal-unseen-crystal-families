# cpaudit_v1 - configuration for Phase 0 and Phase 1 of the revision plan.
# Edit BEFORE running `python run.py prereg`. After pre-registration the runner
# refuses a changed config unless you pass --allow-deviation, and it logs the change.

version: phase01_v1

paths:
  drive_root: /content/drive/MyDrive/NOMAD_Uncer_Quan     # your existing folder (read-only use)
  soap_npz: soap_features_corrected_v2.npz                 # 2400 x 23976, rows in train.csv order
  data_prep_v5: data_prep_v5.npz                           # optional: row-alignment check only
  duplicates_v7: duplicate_entries_v7.csv                  # optional: duplicate cross-check only
  train_csv_url: https://raw.githubusercontent.com/csutton7/nomad_2018_kaggle_dataset/master/train.csv
  out_dir: phase01_v1                                      # NEW subfolder; nothing existing is overwritten
  local_cache: /content/cpaudit_cache                      # fast local copy of the feature matrix

data:
  expected_rows: 2400
  expected_features: 23976
  composition_decimals: 1          # Al/Ga fractions rounded as in v5/v7 (np.round), lattice kept
  fd3m_gamma_split_deg: 60.0       # Fd-3m cells: gamma ~30 deg (227a) vs ~120 deg (227b)

splits:
  n_repeats: 25                    # independent outer splits
  outer_folds: 5                   # test set = fold 0 of StratifiedGroupKFold(5) -> 20 %
  cal_folds: 4                     # calibration = fold 0 of StratifiedGroupKFold(4) on the pool -> 25 %
  seed_base: 20261116

alpha: [0.05, 0.10, 0.20]
alpha_primary: 0.10

cvplus:
  k_random: 5                      # composition-grouped random folds (Regime A)
  run_spacegroup_reference: true   # GroupKFold by lattice = the submitted manuscript's design

normalized:
  knn_k: 25                        # crepes default
  pca_components: 50
  beta: 0.01                       # additive floor on sigma (crepes convention)

cqr:
  enabled: true                    # at alpha_primary only (quantile models at a/2 and 1-a/2)

hpo:
  mode: once                       # 'once': tune on split 0 proper-training set; 'per_split': every split
  n_trials: 25
  n_startup_trials: 10
  inner_folds: 5
  early_stopping_rounds: 50
  max_rounds: 1000
  check_splits: [1, 2]             # re-tuned here to measure how much coverage depends on the tuning

lgbm:
  objective: regression            # L2, as in v5
  max_bin: 63                      # as in v5
  device: cpu                      # see README before switching to 'gpu'
  deterministic: true

compute:
  parallel_fits: auto              # concurrent LightGBM fits; threads are divided evenly
